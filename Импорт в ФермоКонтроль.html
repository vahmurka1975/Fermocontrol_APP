<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Импорт в ФермоКонтроль</title><style>body{font-family:system-ui,sans-serif;margin:0;padding:16px;background:#f6f4ef;color:#222}h1{font-size:20px;margin:0 0 8px}.card{background:#fff;border-radius:12px;padding:14px;margin:12px 0;box-shadow:0 1px 3px #0002}button{font-size:16px;padding:10px 16px;border:0;border-radius:8px;background:#2f6f4f;color:#fff}button:disabled{opacity:.4}table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid #ddd;padding:4px 6px;text-align:left}.err{color:#b00020}.ok{color:#2f6f4f}</style></head><body><h1>Импорт в ФермоКонтроль</h1><div class="card"><p>Выберите файл .xlsx или .csv с колонками: Название, Оболочка, Основа, Специи, product, kind, date, weight_g, target_loss_pct. Файл обрабатывается на вашем устройстве.</p><input type="file" id="f" accept=".xlsx,.csv"></div><div class="card" id="out">Файл не выбран.</div><div class="card"><button id="dl" disabled>Скачать ZIP</button> <span id="msg"></span></div><script>const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));let zipBlob=null;const crcT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=crcT[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}function makeZip(name,data){const nm=new TextEncoder().encode(name),crc=crc32(data),n=data.length;const lh=new DataView(new ArrayBuffer(30));lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0,true);lh.setUint16(8,0,true);lh.setUint16(10,0,true);lh.setUint16(12,0x21,true);lh.setUint32(14,crc,true);lh.setUint32(18,n,true);lh.setUint32(22,n,true);lh.setUint16(26,nm.length,true);lh.setUint16(28,0,true);const cd=new DataView(new ArrayBuffer(46));cd.setUint32(0,0x02014b50,true);cd.setUint16(4,20,true);cd.setUint16(6,20,true);cd.setUint16(8,0,true);cd.setUint16(10,0,true);cd.setUint16(12,0,true);cd.setUint16(14,0x21,true);cd.setUint32(16,crc,true);cd.setUint32(20,n,true);cd.setUint32(24,n,true);cd.setUint16(28,nm.length,true);cd.setUint32(42,0,true);const cdOff=30+nm.length+n;const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,1,true);e.setUint16(10,1,true);e.setUint32(12,46+nm.length,true);e.setUint32(16,cdOff,true);return new Blob([lh.buffer,nm,data,cd.buffer,nm,e.buffer],{type:"application/zip"})}async function inflate(b){const s=new Blob([b]).stream().pipeThrough(new DecompressionStream("deflate-raw"));return new Uint8Array(await new Response(s).arrayBuffer())}async function readZip(buf){const u=new Uint8Array(buf),v=new DataView(buf);let p=u.length-22;while(p>=0&&v.getUint32(p,true)!==0x06054b50)p--;if(p<0)throw new Error("Это не файл xlsx");const cnt=v.getUint16(p+10,true);let o=v.getUint32(p+16,true);const files={};for(let i=0;i<cnt;i++){const m=v.getUint16(o+10,true),cs=v.getUint32(o+20,true),nl=v.getUint16(o+28,true),el=v.getUint16(o+30,true),cl=v.getUint16(o+32,true),lo=v.getUint32(o+42,true);const name=new TextDecoder().decode(u.subarray(o+46,o+46+nl));files[name]={m,cs,lo};o+=46+nl+el+cl}const get=async n=>{const f=files[n];if(!f)return null;const l=f.lo,ds=l+30+v.getUint16(l+26,true)+v.getUint16(l+28,true);const d=u.subarray(ds,ds+f.cs);return new TextDecoder().decode(f.m===0?d:await inflate(d))};return{files,get}}function colIdx(r){let n=0;for(const ch of r.replace(/\d/g,""))n=n*26+ch.charCodeAt(0)-64;return n-1}async function parseXlsx(buf){const z=await readZip(buf),dp=new DOMParser();const ss=[];const sx=await z.get("xl/sharedStrings.xml");if(sx){dp.parseFromString(sx,"application/xml").querySelectorAll("si").forEach(si=>ss.push([...si.getElementsByTagName("t")].map(t=>t.textContent).join("")))}const name=Object.keys(z.files).filter(n=>/^xl\/worksheets\/sheet\d+\.xml$/.test(n)).sort()[0];if(!name)throw new Error("В xlsx нет листов");const doc=dp.parseFromString(await z.get(name),"application/xml");const rows=[];doc.querySelectorAll("row").forEach(r=>{const a=[];r.querySelectorAll("c").forEach(c=>{const t=c.getAttribute("t"),vEl=c.querySelector("v");let val="";if(t==="inlineStr")val=[...c.getElementsByTagName("t")].map(x=>x.textContent).join("");else if(vEl){val=t==="s"?ss[+vEl.textContent]:(t==="str"||t==="b"||t==="e")?vEl.textContent:+vEl.textContent}a[colIdx(c.getAttribute("r"))]=val});rows.push(a)});return rows}function parseCsv(t){t=t.replace(/^\uFEFF/,"");const d=t.split("\n")[0].includes(";")?";":",";const rows=[];let r=[],c="",q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}else if(ch==='"')q=true;else if(ch===d){r.push(c);c=""}else if(ch==="\n"){r.push(c.replace(/\r$/,""));rows.push(r);r=[];c=""}else c+=ch}if(c||r.length){r.push(c.replace(/\r$/,""));rows.push(r)}return rows}function toMs(v){let y,m,d;if(typeof v==="number"){const dt=new Date(Math.round((v-25569)*86400000));y=dt.getUTCFullYear();m=dt.getUTCMonth()+1;d=dt.getUTCDate()}else{const s=String(v).trim();let x=s.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{2,4})$/);if(x){if(s.includes(".")){d=+x[1];m=+x[2]}else{m=+x[1];d=+x[2]}y=+x[3];if(y<100)y+=2000}else{x=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(!x)return NaN;y=+x[1];m=+x[2];d=+x[3]}}return new Date(y,m-1,d,12).getTime()}function build(rows){const hdr=(rows[0]||[]).map(h=>String(h==null?"":h).trim().toLowerCase());const C={},need={name:"название",cas:"оболочка",raw:"основа",sp:"специи",pr:"product",kind:"kind",date:"date",w:"weight_g",t:"target_loss_pct"};for(const k in need){C[k]=hdr.indexOf(need[k]);if(C[k]<0)throw new Error("Нет колонки «"+need[k]+"»")}const num=v=>typeof v==="number"?v:parseFloat(String(v).replace(",","."));const txt=v=>v==null?"":String(v).trim();const map=new Map(),errs=[];rows.slice(1).forEach((r,i)=>{if(!r||txt(r[C.pr])==="")return;const line=i+2,n=Math.round(num(r[C.pr]));if(!(n>0)){errs.push("Строка "+line+": некорректный номер партии");return}let b=map.get(n);if(!b){let cas=txt(r[C.cas]);if(/айцел/i.test(cas))cas="Айцел Премиум";b={number:n,name:txt(r[C.name]),casing:cas,rawMaterial:txt(r[C.raw]),spices:txt(r[C.sp]),target:num(r[C.t]),start:null,at:0,logs:[]};map.set(n,b)}const kind=txt(r[C.kind]).toLowerCase(),at=toMs(r[C.date]),w=num(r[C.w]);if(!isFinite(at)){errs.push("Строка "+line+": не распознана дата");return}if(!(w>0)){errs.push("Строка "+line+": некорректный вес");return}if(kind==="initial"){b.start=w;b.at=at}else if(kind==="control")b.logs.push({atEpochMs:at,weightGrams:w,smellNote:"",surfaceNote:"",needsCheck:false});else errs.push("Строка "+line+": неизвестный kind «"+kind+"»")});const list=[...map.values()].sort((a,b)=>a.number-b.number);list.forEach(b=>{if(b.start==null)errs.push("Партия "+b.number+": нет строки initial");if(!b.name)errs.push("Партия "+b.number+": пустое название");if(!(b.target>0&&b.target<100))errs.push("Партия "+b.number+": цель усушки должна быть больше 0 и меньше 100");b.logs.sort((x,y)=>x.atEpochMs-y.atEpochMs)});return{list,errs}}function journal(list){return JSON.stringify({app:"ФермоКонтроль",format:"fermocontrol",formatVersion:1,version:"1.0",createdAt:String(Date.now()),batches:list.map(b=>({id:b.at+b.number,number:b.number,name:b.name,category:"Сыровяление",rawMaterial:b.rawMaterial,spices:b.spices,casing:b.casing,startWeightGrams:b.start,targetLossPercent:b.target,createdAtEpochMs:b.at,archived:false,note:"",logs:b.logs}))},null,2)}function show(list,errs){let h=errs.length?'<p class="err">Ошибки, файл не создан:</p><ul>'+errs.slice(0,30).map(e=>"<li>"+esc(e)+"</li>").join("")+"</ul>":'<p class="ok">Готово. Партий: '+list.length+".</p>";h+="<table><tr><th>№</th><th>Название</th><th>Оболочка</th><th>Основа</th><th>Старт, г</th><th>Цель, %</th><th>Замеров</th><th>Усушка, %</th></tr>";list.forEach(b=>{const last=b.logs.length?b.logs[b.logs.length-1].weightGrams:b.start;const loss=b.start?((1-last/b.start)*100).toFixed(1):"";h+="<tr><td>"+b.number+"</td><td>"+esc(b.name)+"</td><td>"+esc(b.casing)+"</td><td>"+esc(b.rawMaterial)+"</td><td>"+b.start+"</td><td>"+b.target+"</td><td>"+b.logs.length+"</td><td>"+loss+"</td></tr>"});$("out").innerHTML=h+"</table>"}$("f").onchange=async e=>{const f=e.target.files[0];if(!f)return;$("dl").disabled=true;$("msg").textContent="";$("out").textContent="Читаю файл…";try{const rows=/\.csv$/i.test(f.name)?parseCsv(await f.text()):await parseXlsx(await f.arrayBuffer());const{list,errs}=build(rows);show(list,errs);if(!errs.length&&list.length){zipBlob=makeZip("journal.json",new TextEncoder().encode(journal(list)));$("dl").disabled=false}}catch(x){$("out").innerHTML='<span class="err">'+esc(x.message)+"</span>"}};$("dl").onclick=()=>{const u=URL.createObjectURL(zipBlob),a=document.createElement("a");a.href=u;a.download="fermocontrol_import.zip";a.textContent="Если загрузка не началась, нажмите здесь";a.click();$("msg").innerHTML="";$("msg").appendChild(a)};</script></body></html>
